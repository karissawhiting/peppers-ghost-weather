<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ghost weather</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- stage is rotated and flipped by app.js -->
  <div id="stage">
    <!-- test image behind the text, shown only with ?image=1 -->
    <img id="bg" alt="" hidden>
    <!-- test clip behind the text, shown only with ?video=1 -->
    <video id="bgvideo" muted loop autoplay playsinline preload="auto" hidden></video>
    <div id="main">
      <div id="temp"></div>
      <div id="condition"></div>
      <div id="state-label"><span id="state-bar"></span><span id="state-name"></span></div>
    </div>
    <div id="updated"><span id="dot"></span><span id="updated-text"></span></div>
    <div id="credit">Weather data by Open-Meteo.com</div>
    <div id="status">wake lock: checking</div>
    <div id="version"></div>
  </div>
  <script src="weather.js"></script>
  <script src="app.js"></script>
</body>
</html>
